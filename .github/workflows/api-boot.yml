# API boot smoke check
#
# What it protects:
#   The API must start from a clean checkout on a blank database, exactly the
#   way the Procfile starts it in production (`puma -C config/puma.rb`).
#   Catches the "it only runs on someone's laptop" class of failure:
#   missing directories, missing/renamed env vars, broken migrations,
#   broken seeds, gems that fail to load, config that crashes on boot.
#
# What it deliberately does NOT cover:
#   Business logic, data integrity, auth, or the Gemini integration.
#   Gemini runs without an API key here; those paths are covered elsewhere.
#
# Related finding: F-01 in assessment/01-audit.md

name: API boot

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boot:
    name: Boot API from clean checkout
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: api

    # Throwaway PostgreSQL and Redis containers, created fresh for every run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Dummy, non-secret values: just enough for the app to boot.
    env:
      RAILS_ENV: development
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY_BASE: ci-dummy-secret-key-base-not-for-production
      ALLOWED_ORIGINS: http://localhost:5173
      APP_BASE_URL: http://localhost:3001
      WEB_CONCURRENCY: "0"
      RAILS_MAX_THREADS: "5"

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # Installs the Ruby version from api/.ruby-version and the gems from
      # api/Gemfile.lock, cached between runs.
      - name: Set up Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          working-directory: api
          bundler-cache: true

      - name: Create, migrate, and seed a blank database
        run: bundle exec rails db:create db:migrate db:seed

      # Starts the API the same way the Procfile does, then polls /health.
      # Fails fast if the server process dies, instead of waiting out the timeout.
      - name: Start API and check /health
        run: |
          bundle exec puma -C config/puma.rb > "$RUNNER_TEMP/puma.log" 2>&1 &
          PUMA_PID=$!

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/health; then
              echo
              echo "API is up (attempt $i)"
              kill "$PUMA_PID"
              exit 0
            fi
            if ! kill -0 "$PUMA_PID" 2>/dev/null; then
              echo "::error::API process exited during boot. See 'Show API log' below."
              exit 1
            fi
            sleep 1
          done

          echo "::error::API did not respond on /health within 30 seconds."
          exit 1

      - name: Show API log
        if: failure()
        run: cat "$RUNNER_TEMP/puma.log" || echo "no log written"
